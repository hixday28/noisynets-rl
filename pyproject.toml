[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "noisynets-mgmo"
version = "0.1.0"
description = "Исследование DQN и NoisyNet-DQN в курсовой работе по МГМО"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "gymnasium>=1.1,<2", "numpy>=2,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
research = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "pytest>=8,<10", "scipy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
